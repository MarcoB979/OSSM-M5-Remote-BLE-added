
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
description = OSSM M5 Remote
data_dir = data
default_envs = m5stack-core2

[env]
framework = arduino
build_src_filter =
     +<*>
     -<Manuals-templates/>
     -<Backup testing/>
     -<Files-to-delete/>
extra_scripts = 
    scripts/merge_bin.py
    scripts/rename_fw.py
monitor_speed = 115200
upload_protocol = esptool
board_build.partitions = default_16MB.csv
lib_deps =
     m5stack/M5Unified@0.1.16
     m5stack/M5GFX@0.1.16
     mathertel/OneButton@^2.0.3
     lvgl/lvgl@^9.1.0
     madhephaestus/ESP32Encoder@^0.10.2
     h2zero/NimBLE-Arduino@^2.3.4
     tzapu/WiFiManager@^2.0.17
     links2004/WebSockets@^2.4.1
     bblanchon/ArduinoJson@^7.0.4
     ayushsharma82/ElegantOTA@^3.1.0
     ; ESPAsyncWebServer + AsyncTCP are pulled in transitively by ElegantOTA
     ; (owner "esp32async"); no need to list them here.
     
build_flags = 
    ; Build flags that influence behaviour of firmware:

    ;-D SHOWBLEPOLL ;comment  (so ;-D) if you do not want to see the BLE state machine debug output in serial monitor
    ;-D RAIL_LENGTH = 123 ;If you want to manually set your rail length (for depth jogging), define it here. Also in settings menu the rail length can be set 
     ; Speed behaviour profile is selected from the Settings menu.

     ; NimBLE-Arduino's max simultaneous connections is a compile-time constant
     ; (default 3, fixed-size internal array + per-connection buffers). 8 was
     ; overkill: NimBLE pre-allocates buffers per connection, and together with
     ; the WiFi stack it exhausted the ESP32's internal SRAM (BLE "host reset
     ; rc=12" / "disc_chrs rc=7" and crashes in the WiFi captive portal).
     ; Realistic max = OSSM + 2 toys + 1 addon = 4. Must be defined before
     ; nimconfig.h is first included (i.e. as a global -D, not a runtime call).
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

     ; Move the NimBLE host memory pools (msys/ACL buffers) out of internal
     ; SRAM into the 8 MB PSRAM. DISABLED: while it freed internal SRAM (needed
     ; when the old WebServer + /remote page were running), it put the BLE host
     ; buffers in slow PSRAM, which broke multi-connection BLE — with the OSSM
     ; AND the Coyote connected, the OSSM link got starved and stopped moving.
     ; /remote is gone and /update+/toys now run on the lighter async server, so
     ; internal SRAM no longer needs this. Re-enable ONLY if the web pages crash
     ; with esp_timer_create / ESP_ERR_NO_MEM again.
     ;-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1

     ; Serve /update and /toys with the asynchronous, multi-client web server
     ; (runs in its own task) instead of the single-client blocking WebServer,
     ; so open pages never stall the UI loop or block other clients.
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1

     ; Build flags for versioning and naming of firmware:
    -D BUILD_TARGET=\"$PIOENV\"
    -D APP_NAME=\"OSSM-M5-Remote\" ; Must only contain characters from [a-zA-Z0-9-_] as this is converted into a filename
    ;-D APP_VERSION=\"2.2.0\" ; semver compatible version string
    -D APP_VERSION=\"V3.0\" ; semver compatible version string

     ; Build flags for LVGL library. DO NOT CHANGE/REMOVE!
    -D LV_CONF_INCLUDE_SIMPLE
    -I src




[env:m5stack-core2]
platform = espressif32@6.5.0
board = m5stack-core2
build_flags = 
     -D CORE_DEBUG_LEVEL=2
     ${env.build_flags}



[env:m5stack-cores3]
platform = espressif32@6.5.0
board = m5stack-cores3
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
build_flags =
     -D SERIAL_INFO
     -D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1   
     -DCORE_DEBUG_LEVEL=5 
     ${env.build_flags}

;upload_port = com7
;monitor_port = com7