<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a12" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>OSSM Remote</title>
<style>
  :root {
    --bg-color: #0a0a12;
    --panel-bg: #0f172a;
    --border-color: #334155;
    --text-color: #dde6f0;
    --muted: #94a3b8;
    --color-top: #ff0c00;
    --color-bottom: #ff8100;
    --color-rise: #ffff00;
    --color-fall: #00ff00;
    --color-curvein: #0000ff;
    --color-curveout: #ac8dee;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  .phone-container {
    width: 100%; max-width: 400px;
    background-color: #05050a;
    border: 4px solid #1e293b; border-radius: 24px;
    padding: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.7);
  }
  .ble-panel {
    display: flex; justify-content: space-between; align-items: center;
    background-color: #111827; padding: 10px; border-radius: 12px;
    margin-bottom: 14px; border: 1px solid var(--border-color);
  }
  .ble-panel.small { padding: 6px 10px; margin-bottom: 10px; }
  .ble-btn { background-color: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: .85rem; }
  .ble-btn.small { padding: 4px 10px; font-size: .75rem; }
  .ble-btn.danger { background-color: #dc2626; }
  .ble-status { font-size: .8rem; font-family: monospace; color: var(--muted); }
  .ble-status.small { font-size: .7rem; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .screen-header { flex: 1; min-width: 0; text-align: left; font-size: 1.05rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #22c55e; flex: 0 0 auto; box-shadow: 0 0 6px rgba(34, 197, 94, 0.8); }
  .tabs-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .tab-row { display: flex; justify-content: space-between; gap: 4px; }
  .tab-box {
    flex: 1; background-color: #3a3a3a; border-radius: 4px; text-align: center;
    padding: 6px 2px; font-size: .78rem; font-weight: bold; color: var(--text-color);
    border: 2px solid transparent; cursor: pointer;
  }
  .tab-value { font-size: .85rem; font-weight: bold; line-height: 1.1; }
  .tab-name { font-size: .55rem; font-weight: normal; line-height: 1.1; margin-top: 2px; }
  .visualizer-area { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .meter-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
  .meter-bar { width: 12px; height: 132px; background-color: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 4px; position: relative; overflow: hidden; }
  .meter-fill { position: absolute; bottom: 0; width: 100%; height: 50%; transition: height .1s; }
  .meter-label { font-size: 10px; color: var(--muted); text-align: center; }
  canvas { display: block; background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 280px; max-width: 100%; height: auto; flex: 0 1 auto; min-width: 0; }
  .sliders-panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .slider-group { margin-bottom: 12px; }
  .slider-group:last-child { margin-bottom: 0; }
  .slider-label { display: flex; justify-content: space-between; font-size: .8rem; margin-bottom: 4px; }
  .slider-label .val-num { font-family: monospace; font-size: .9rem; font-weight: bold; }
  .inline-toggle { display: flex; align-items: center; justify-content: space-between; font-size: .8rem; color: var(--text-color); cursor: pointer; }
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4b5563; border-radius: 20px; transition: .2s; }
  .switch .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background-color: #22c55e; }
  .switch input:checked + .slider:before { transform: translateX(16px); }
  input[type=range] { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; outline: none; -webkit-appearance: none; appearance: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; cursor: pointer; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row .slider-name { flex: 0 0 90px; font-size: .8rem; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slider-row .val-num { flex: 0 0 auto; min-width: 40px; text-align: left; line-height: 26px; padding: 0 7px; border-radius: 4px; font-family: monospace; font-size: .85rem; font-weight: bold; }
  .val-input { width: 2.5em; min-width: 0; background: transparent; border: none; outline: none; color: inherit; font: inherit; text-align: inherit; padding: 0; margin: 0; height: 24px; vertical-align: middle; }
  .val-input::-webkit-outer-spin-button, .val-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .val-input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .slider-row input[type=range] { flex: 1; }
  .step-btn {
    flex: 0 0 auto; width: 26px; height: 26px;
    background: #1e293b; border: 1px solid var(--border-color); border-radius: 6px;
    color: #fff; font-size: 1.05rem; font-weight: bold; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .step-btn:active { background: #334155; }
  select { background: #1e293b; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; padding: 8px; font-size: .85rem; width: 100%; }
  .start-stop-row { position: sticky; bottom: 0; z-index: 10; margin-top: 8px; padding-top: 8px; background: #05050a; }
  .speed-line { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .speed-label { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .speed-val { font-family: monospace; font-size: .9rem; font-weight: bold; color: #fff; min-width: 30px; text-align: right; }
  .speed-line input[type=range] { flex: 1; }
  #btnStart { width: 100%; background-color: #16a34a; border: none; border-radius: 10px; padding: 14px; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; }
  #btnStart.stop { background-color: #dc2626; }
  .reset-row { text-align: center; margin-bottom: 4px; }
  #btnResetValues { background: none; border: none; color: #ff5b6a; font-size: .78rem; cursor: pointer; text-decoration: underline; padding: 4px 8px; }
  .mode-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 10px; }
  .mode-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .mode-seg { display: flex; background: #1e293b; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
  .mode-btn { background: transparent; color: var(--muted); border: none; padding: 5px 12px; font-size: .78rem; font-weight: bold; cursor: pointer; }
  .mode-btn.active { background: #2563eb; color: #fff; }
  .presets-panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-top: 12px; }
  .presets-panel summary {
    list-style: none; cursor: pointer; user-select: none;
    font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between;
  }
  .presets-panel .summary-left { display: flex; align-items: baseline; min-width: 0; }
  .presets-panel .summary-value { text-transform: none; letter-spacing: 0; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .presets-panel .summary-value:empty { display: none; }
  .presets-panel .summary-value:not(:empty)::before { content: ":"; margin-right: 5px; }
  .presets-panel summary::-webkit-details-marker { display: none; }
  .presets-panel summary::after { content: "▾"; font-size: .7rem; }
  .presets-panel[open] summary { margin-bottom: 8px; }
  .presets-panel[open] summary::after { content: "▴"; }
  #presetList { display: flex; gap: 8px; align-items: center; }
  #presetList select { flex: 1; width: auto; min-width: 0; }
  #presetList button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
  #presetList button.danger { background: #7f1d1d; }
  .preset-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: .85rem; }
  .preset-item .pname { flex: 1; }
  .preset-item button { background: transparent; border: 1px solid #5b8cff; color: #5b8cff; border-radius: 6px; padding: 4px 8px; font-size: .75rem; cursor: pointer; margin-left: 4px; }
  .preset-item button.danger { border-color: #ff5b6a; color: #ff5b6a; }
  .preset-row { display: flex; gap: 8px; margin-top: 10px; }
  .preset-row input { flex: 1; background: #1e293b; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; padding: 8px; font-size: .85rem; }
  .preset-row button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
  .preset-row button.danger { background: #7f1d1d; }
  .cpp-logger { width: 100%; max-width: 400px; background: #000; font-family: 'Courier New', monospace; font-size: .75rem; color: #38bdf8; padding: 12px; border-radius: 8px; margin-top: 16px; border: 1px solid #1e293b; box-sizing: border-box; max-height: 250px; overflow-y: auto; }
  @media (max-width: 480px) {
    body { padding: 0; }
    .phone-container {
      max-width: none;
      border: none;
      border-radius: 0;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      box-shadow: none;
    }
    .cpp-logger { max-height: 160px; }
    .step-btn { width: 36px; height: 36px; }
    .slider-row, .speed-line { flex-wrap: wrap; }
    .slider-row .slider-name, .speed-line .speed-label { order: 0; }
    .step-btn.minus { order: 1; margin-left: auto; }
    .slider-row .val-num, .speed-line .speed-val { order: 2; }
    .step-btn.plus { order: 3; }
    .slider-row input[type=range], .speed-line input[type=range] { order: 4; flex: 1 1 100%; }
    input[type=range] { height: 8px; }
    input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; }
    .start-stop-row { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="phone-container">
  <div class="ble-panel" id="ble-panel">
    <span class="ble-status" id="ble-text">OSSM: Disconnected</span>
    <button class="ble-btn" id="ble-button">Connect</button>
  </div>

  <div class="header-row">
    <span class="conn-dot" id="conn-dot" style="display:none;"></span>
    <div class="screen-header" id="active-title">OSSM Advanced Penetration</div>
    <button class="ble-btn small danger" id="header-disconnect" style="display:none;">Disconnect</button>
  </div>

  <div class="tabs-container" id="tabs-wrapper"></div>

  <div class="visualizer-area">
    <div class="meter-col"><div class="meter-label">Max</div><div class="meter-bar"><div class="meter-fill" id="left-meter" style="background-color: var(--color-top);"></div></div></div>
    <canvas id="graphCanvas" width="280" height="132"></canvas>
    <div class="meter-col"><div class="meter-label">Min</div><div class="meter-bar"><div class="meter-fill" id="right-meter" style="background-color: var(--color-bottom);"></div></div></div>
  </div>

  <div class="speed-line" id="speed-control"></div>

  <div class="sliders-panel" id="sliders-wrapper"></div>

  <div class="reset-row" id="reset-row">
    <button id="btnResetValues">Reset all values</button>
  </div>

  <div class="mode-row" id="mode-row">
    <span class="mode-label">Mode</span>
    <div class="mode-seg">
      <button id="modeAp" class="mode-btn active">Advanced</button>
      <button id="modeStd" class="mode-btn">Standard</button>
    </div>
  </div>

  <details class="presets-panel" id="presets-panel">
    <summary><span class="summary-left">Presets<span class="summary-value" id="presetSummaryName"></span></span></summary>
    <div id="presetList"></div>
    <div class="preset-row">
      <input type="text" id="presetName" placeholder="New preset name" />
      <button id="btnSavePreset">Save</button>
      <button id="btnFactoryReset" class="danger">Reset</button>
    </div>
  </details>

  <div class="start-stop-row">
    <button id="btnStart">Start</button>
  </div>
</div>

<div class="cpp-logger">
  <strong style="color:#fff;">OSSM Live Dashboard Monitor:</strong>
  <div id="log" style="margin-top:6px;">Open this in Chrome or Edge to control the OSSM over Bluetooth.</div>
</div>

<script>
"use strict";

const SERVICE_UUID   = "4f53534d-0000-0000-0000-000000000000";
const CONTROL_UUID   = "4f53534d-6164-7661-6e63-6564636f6e74";
const CONFIG_UUID    = "4f53534d-6164-7661-6e63-6564636f6e66";
const STATUS_UUID    = "4f53534d-6164-7661-6e63-656473746174";
const PRESETS_UUID   = "4f53534d-6164-7661-6e63-656470727374";

// Standard (home) mode lives on the legacy OSSM service.
const LEGACY_SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69";
const STD_CMD_UUID        = "522b443a-4f53-534d-1000-420badbabe69";
const STD_STATE_UUID      = "522b443a-4f53-534d-2000-420badbabe69";
const STD_PATTERNS_UUID   = "522b443a-4f53-534d-3000-420badbabe69";
const STD_PATTERN_FALLBACK = ["Simple Stroke", "Teasing Pounding", "Robo Stroke", "Half'n'Half", "Deeper", "Stop'n'Go", "Insist", "Progressive Stroke", "Random Stroke", "Go to Point"];

let device = null, server = null;
let ctlChar = null, cfgChar = null, stsChar = null, prsChar = null;
let stdCmd = null, stdState = null, stdPatternsChar = null;
let presetNames = [];
let connected = false;
let running = false;
let appMode = "ap";          // "ap" (advanced penetration) | "std" (standard home)
let stdValues = { speed: 0, max: 100, min: 0, sensation: 50, pattern: 0 };
let stdPatterns = STD_PATTERN_FALLBACK.map((name, idx) => ({ name, idx }));
let stdStateName = "";
let stdRunning = false;
let lastNonZeroSpeed = 50;

const BASE_NAMES = ["Max Depth", "Min Depth", "In Speed", "Out Speed", "In Accel", "Out Accel"];
const BASE_COLORS = ["#ff0c00", "#ff8100", "#ffff00", "#00ff00", "#0000ff", "#ac8dee"];
const MODIFIER_NAMES = ["Amplitude", "Steps to Min", "Steps at Min", "Steps to Max", "Steps at Max", "Offset"];
const MOD_COLORS = ["#38bdf8", "#34d399", "#fbbf24", "#f87171", "#c084fc", "#94a3b8"];
const SPEED_KEY = "SP";

// Firmware defaults (OSSM-Lite advanced_penetration_structs.h).
const BASE_DEFAULTS = [10, 0, 100, 100, 40, 40];   // Max Depth, Min Depth, In Speed, Out Speed, In Accel, Out Accel
const SPEED_DEFAULT = 0;
const MODIFIER_DEFAULTS = [100, 1, 0, 1, 0, 0];    // Amplitude, Steps to Min, Steps at Min, Steps to Max, Steps at Max, Offset

// Firmware names -> canonical keys (used when parsing CONFIG strings).
const BASE_ALIAS = {
  "Max Depth": "Max Depth", "Min Depth": "Min Depth",
  "In Speed": "In Speed", "Out Speed": "Out Speed",
  "In Accel": "In Accel", "Out Accel": "Out Accel"
};
const MODIFIER_ALIAS = {
  "Amplitude": "Amplitude",
  "Steps to Min": "Steps to Min", "Steps at Min": "Steps at Min",
  "Steps to Max": "Steps to Max", "Steps at Max": "Steps at Max",
  "Offset": "Offset"
};

// Combined-key dictionary: settings["Max Depth"], settings["Max DepthAmplitude"], settings["In SpeedSteps to Min"], settings["SP"], ...
// Each entry: { min, max, value }.
// Seeded with the OSSM-Lite advanced-penetration firmware defaults so the graph
// and tabs render consistently before the device is connected.
function buildDefaultSettings() {
  const s = {};
  const baseMin = [0, 0, 1, 1, 0, 0];
  const baseMax = [100, 100, 100, 100, 100, 100];
  const modMin = [0, 1, 0, 1, 0, 0];
  const modMax = [100, 25, 25, 25, 25, 100];
  for (let i = 0; i < BASE_NAMES.length; i++) {
    s[BASE_NAMES[i]] = { min: baseMin[i], max: baseMax[i], value: BASE_DEFAULTS[i] };
    for (let mi = 0; mi < MODIFIER_NAMES.length; mi++) {
      s[BASE_NAMES[i] + MODIFIER_NAMES[mi]] = { min: modMin[mi], max: modMax[mi], value: MODIFIER_DEFAULTS[mi] };
    }
  }
  s[SPEED_KEY] = { min: 0, max: 100, value: SPEED_DEFAULT };
  return s;
}
let settings = buildDefaultSettings();

const $ = (id) => document.getElementById(id);
const log = (msg) => { $("log").textContent = msg || ""; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const decode = (dv) => new TextDecoder().decode(dv);
const encode = (s) => new TextEncoder().encode(s);

const speedIndex = () => 6; // firmware: 6 base controls + speed at index 6
function baseKey(i) { return i === speedIndex() ? SPEED_KEY : BASE_NAMES[i]; }
function modifierKey(bi, mi) { return BASE_NAMES[bi] + MODIFIER_NAMES[mi]; }
function getSetting(key) { return settings[key] || { min: 0, max: 100, value: 0 }; }
function settingValue(key, fallback = 0) {
  const s = settings[key];
  return s ? s.value : fallback;
}

const canvas = $("graphCanvas");
const ctx = canvas.getContext("2d");

// ---------- BLE ----------
async function readStr(ch) { return decode(await ch.readValue()); }
async function writeControl(s) {
  try { await ctlChar.writeValueWithoutResponse(encode(s)); }
  catch { await ctlChar.writeValueWithResponse(encode(s)); }
}
async function writePreset(s) { await prsChar.writeValueWithResponse(encode(s)); }

function parseConfig(raw) {
  const parsed = {};
  for (const entry of raw.split(",")) {
    const m = entry.match(/^([^(]+)\((\d+)\/(\d+)\)(.*)$/);
    if (!m) continue;
    const rawName = m[1].trim();
    const min = parseInt(m[2], 10);
    const max = parseInt(m[3], 10);

    let canonical;
    if (rawName === "Speed" || rawName === "SP") canonical = SPEED_KEY;
    else canonical = BASE_ALIAS[rawName];
    if (!canonical) continue;

    parsed[canonical] = { min, max, value: min };
    if (canonical === SPEED_KEY) continue; // speed has no modifiers

    const re = /:([^(]+)\((\d+)\/(\d+)\)/g;
    let mm;
    while ((mm = re.exec(m[4])) !== null) {
      const modCanonical = MODIFIER_ALIAS[mm[1].trim()];
      if (!modCanonical) continue;
      const modMin = parseInt(mm[2], 10);
      const modMax = parseInt(mm[3], 10);
      parsed[canonical + modCanonical] = { min: modMin, max: modMax, value: modMin };
    }
  }
  settings = parsed;
  if (!settings[SPEED_KEY]) settings[SPEED_KEY] = { min: 0, max: 100, value: 0 };
}

function parseStatus(raw) {
  const entries = raw.split(",");
  entries.forEach((entry, i) => {
    const parts = entry.split(":");
    if (i === speedIndex()) {
      const v = parseFloat(parts[0]);
      if (!isNaN(v)) {
        const s = getSetting(SPEED_KEY);
        s.value = clamp(v, s.min, s.max);
        settings[SPEED_KEY] = s;
      }
      return;
    }
    if (i >= BASE_NAMES.length) return;

    const key = BASE_NAMES[i];
    const base = parseFloat(parts[0]);
    if (!isNaN(base)) {
      const s = getSetting(key);
      s.value = clamp(base, s.min, s.max);
      settings[key] = s;
    }
    for (let mi = 0; mi < MODIFIER_NAMES.length; mi++) {
      if (mi + 1 >= parts.length) break;
      const v = parseFloat(parts[mi + 1]);
      if (isNaN(v)) continue;
      const mk = key + MODIFIER_NAMES[mi];
      const s = getSetting(mk);
      s.value = clamp(v, s.min, s.max);
      settings[mk] = s;
    }
  });
}

const speed = () => Math.round(settingValue(SPEED_KEY));

async function connect() {
  if (!navigator.bluetooth) { log("Web Bluetooth not available. Use Chrome/Edge over HTTPS or localhost."); return; }
  log("Requesting device…");
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID, LEGACY_SERVICE_UUID]
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    log("Connecting to " + (device.name || "OSSM") + "…");
    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE_UUID);
    ctlChar = await svc.getCharacteristic(CONTROL_UUID);
    cfgChar = await svc.getCharacteristic(CONFIG_UUID);
    stsChar = await svc.getCharacteristic(STATUS_UUID);
    prsChar = await svc.getCharacteristic(PRESETS_UUID);

    // Standard-mode characteristics (legacy service) — best effort.
    stdCmd = null; stdState = null; stdPatternsChar = null;
    try {
      const legacy = await server.getPrimaryService(LEGACY_SERVICE_UUID);
      try { stdCmd = await legacy.getCharacteristic(STD_CMD_UUID); } catch (e) {}
      try { stdState = await legacy.getCharacteristic(STD_STATE_UUID); } catch (e) {}
      try { stdPatternsChar = await legacy.getCharacteristic(STD_PATTERNS_UUID); } catch (e) {}
    } catch (e) {}

    if (stsChar.properties.notify) {
      stsChar.addEventListener("characteristicvaluechanged", onStatus);
      await stsChar.startNotifications();
    }
    if (stdState && stdState.properties.notify) {
      stdState.addEventListener("characteristicvaluechanged", onStdState);
      try { await stdState.startNotifications(); } catch (e) {}
    }
    log("Reading configuration…");
    const cfg = await readStr(cfgChar);
    parseConfig(cfg);
    await refreshStatus();
    await refreshPresets();
    await refreshStdPatterns();
    await refreshStdValues();
    connected = true;
    running = speed() > 0;
    lastNonZeroSpeed = speed() > 0 ? speed() : 50;
    $("ble-panel").style.display = "none";
    $("conn-dot").style.display = "inline-block";
    $("header-disconnect").style.display = "inline-block";
    buildInterface();
    log("");
  } catch (e) {
    $("ble-text").textContent = "OSSM: Error 🔴";
    log("Bluetooth error: " + e.message);
  }
}

function onDisconnected() {
  connected = false; running = false; stdRunning = false;
  $("ble-panel").style.display = "";
  $("conn-dot").style.display = "none";
  $("header-disconnect").style.display = "none";
  log("Disconnected from OSSM.");
  buildInterface();
}

function disconnect() {
  try {
    if (server && server.connected) server.disconnect();
    else if (device && device.gatt.connected) device.gatt.disconnect();
  } catch (e) { log("Disconnect failed: " + e.message); }
}

function onStatus(ev) { parseStatus(decode(ev.target.value)); buildInterface(); }
async function refreshStatus() { parseStatus(await readStr(stsChar)); }
async function refreshPresets() {
  presetNames = (await readStr(prsChar)).split(",").map(s => s.trim()).filter(Boolean);
  renderPresets();
}

// ---------- Standard (home) mode ----------
function parseStdState(raw) {
  let j;
  try { j = JSON.parse(raw); } catch (e) { return; }
  if (typeof j.speed === "number") stdValues.speed = Math.round(j.speed);
  if (typeof j.maxPosition === "number") stdValues.max = Math.round(j.maxPosition);
  if (typeof j.minPosition === "number") stdValues.min = Math.round(j.minPosition);
  if (typeof j.sensation === "number") stdValues.sensation = Math.round(j.sensation);
  if (typeof j.pattern === "number") stdValues.pattern = Math.round(j.pattern);
  if (typeof j.state === "string") stdStateName = j.state;
  stdRunning = stdValues.speed > 0.5;
}
function onStdState(ev) { parseStdState(decode(ev.target.value)); if (appMode === "std") buildInterface(); }

async function stdWrite(cmd) {
  if (!stdCmd) return;
  const data = encode(cmd);
  try { await stdCmd.writeValueWithoutResponse(data); }
  catch (e) { try { await stdCmd.writeValueWithResponse(data); } catch (e2) { log("Std write failed: " + e2.message); } }
}

async function refreshStdPatterns() {
  stdPatterns = [];
  if (stdPatternsChar) {
    try {
      const arr = JSON.parse(decode(await stdPatternsChar.readValue()));
      if (Array.isArray(arr)) stdPatterns = arr.map(p => ({ name: p.name, idx: p.idx }));
    } catch (e) {}
  }
  if (!stdPatterns.length) stdPatterns = STD_PATTERN_FALLBACK.map((name, idx) => ({ name, idx }));
}

async function refreshStdValues() {
  if (!stdState) return;
  try { parseStdState(decode(await stdState.readValue())); } catch (e) {}
}

// ---------- Commands ----------
function baseRange(i) {
  const s = getSetting(baseKey(i));
  let lo = s.min, hi = s.max;
  if (i === 0) lo = Math.max(lo, Math.round(settingValue(BASE_NAMES[1])));
  else if (i === 1) hi = Math.min(hi, Math.round(settingValue(BASE_NAMES[0])));
  return { min: lo, max: hi };
}

function setBase(i, v) {
  const key = baseKey(i);
  const s = getSetting(key);
  v = clamp(Math.round(v), s.min, s.max);
  if (i === 0) v = Math.max(v, Math.round(settingValue(BASE_NAMES[1])));
  else if (i === 1) v = Math.min(v, Math.round(settingValue(BASE_NAMES[0])));
  s.value = v;
  settings[key] = s;
  if (i >= 0 && i < BASE_NAMES.length) activeBaseIndex = i; // highlight the moved setting
  writeControl(`${i}:${v},`).catch(e => log("Write failed: " + e));
  buildInterface();
}
function setSpeed(v) { setBase(speedIndex(), v); if (v > 0) lastNonZeroSpeed = v; }
function setModifier(bi, mi, v) {
  const key = modifierKey(bi, mi);
  const s = getSetting(key);
  v = clamp(Math.round(v), s.min, s.max);
  s.value = v;
  settings[key] = s;
  activeModifierIndex = mi; // highlight the moved modifier
  writeControl(`${bi}:${mi}:${v},`).catch(e => log("Write failed: " + e));
  buildInterface();
}
function toggleStart() {
  if (appMode === "std") {
    if (stdRunning) stdWrite("set:speed:0");
    else {
      stdWrite("go:strokeEngine");
      stdWrite("set:speed:" + (stdValues.speed > 0 ? stdValues.speed : 50));
    }
    return;
  }
  if (speed() > 0) setSpeed(0);
  else setSpeed(lastNonZeroSpeed > 0 ? lastNonZeroSpeed : 50);
}

function setLocal(key, v) {
  const s = getSetting(key);
  s.value = clamp(Math.round(v), s.min, s.max);
  settings[key] = s;
}

// Resets every base value, speed, and all modifiers to the firmware defaults.
function resetAllValues() {
  for (let i = 0; i < BASE_NAMES.length; i++) setLocal(baseKey(i), BASE_DEFAULTS[i]);
  setLocal(SPEED_KEY, SPEED_DEFAULT);
  for (let bi = 0; bi < BASE_NAMES.length; bi++)
    for (let mi = 0; mi < MODIFIER_NAMES.length; mi++)
      setLocal(modifierKey(bi, mi), MODIFIER_DEFAULTS[mi]);
  buildInterface();

  const parts = [];
  for (let i = 0; i < BASE_NAMES.length; i++) parts.push(`${i}:${BASE_DEFAULTS[i]}`);
  parts.push(`${speedIndex()}:${SPEED_DEFAULT}`);
  for (let bi = 0; bi < BASE_NAMES.length; bi++)
    for (let mi = 0; mi < MODIFIER_NAMES.length; mi++)
      parts.push(`${bi}:${mi}:${MODIFIER_DEFAULTS[mi]}`);
  writeControl(parts.join(",") + ",")
    .then(() => setTimeout(async () => { await refreshStatus(); buildInterface(); }, 800))
    .catch(e => log("Reset failed: " + e));
}

// ---------- UI ----------
let viewMode = "main";          // "main" | "mod"
let activeBaseIndex = 0;        // 0..5 (main base controls)
let activeModifierIndex = 0;    // 0..5 (modifier type)
let presetSelection = "";       // currently selected preset in the dropdown
let showAll = false;            // shared: show all sliders (main + modifier screens)
let modifierRowVisible = false; // toggles the modifier squares row under the active base

// Picks a readable text color (black/white) for the active tab's bright background.
function tabTextColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.5 ? "#000000" : "#ffffff";
}
function buildInterface() {
  const isStd = appMode === "std";
  $("active-title").textContent = isStd
    ? "OSSM Standard"
    : (viewMode === "main" ? "OSSM Advanced Penetration" : "Modifier for: " + BASE_NAMES[activeBaseIndex]);
  const runningNow = isStd ? stdRunning : speed() > 0;
  $("btnStart").textContent = runningNow ? "Stop" : "Start";
  $("btnStart").classList.toggle("stop", runningNow);

  $("tabs-wrapper").style.display = isStd ? "none" : "";
  $("reset-row").style.display = (isStd || viewMode !== "main" || !showAll) ? "none" : "";
  $("presets-panel").style.display = isStd ? "none" : "";
  $("modeAp").classList.toggle("active", !isStd);
  $("modeStd").classList.toggle("active", isStd);

  if (isStd) buildStdSliders();
  else { buildTabs(); buildSliders(); renderPresets(); }
  buildSpeed();
  drawGraph();
}

function buildTabs() {
  const wrap = $("tabs-wrapper");
  wrap.innerHTML = "";
  const mk = (text, active, color, title, label, dim = false) => {
    const d = document.createElement("div");
    d.className = "tab-box";
    d.title = title;
    d.innerHTML = `<div class="tab-value">${text}</div>` + (label ? `<div class="tab-name">${label}</div>` : "");
    d.style.background = active ? color : (dim ? `color-mix(in srgb, ${color} 22%, #3a3a3a)` : "#3a3a3a");
    d.style.color = active ? tabTextColor(color) : "#dde6f0";
    d.style.borderColor = active ? "#ffffff" : "transparent";
    return d;
  };
  const addRow = () => {
    const row = document.createElement("div");
    row.className = "tab-row";
    wrap.appendChild(row);
    return row;
  };

  // Base squares row (always visible — acts as navigation).
  const baseRow = addRow();
  for (let i = 0; i < BASE_NAMES.length; i++) {
    const d = mk(Math.round(settingValue(BASE_NAMES[i])), i === activeBaseIndex, BASE_COLORS[i], BASE_NAMES[i], BASE_NAMES[i], true);
    d.onclick = () => {
      if (activeBaseIndex === i) modifierRowVisible = !modifierRowVisible;
      else { activeBaseIndex = i; modifierRowVisible = true; }
      viewMode = "main";
      buildInterface();
    };
    baseRow.appendChild(d);
  }

  // Modifier squares row for the selected base (only while toggled on).
  if (modifierRowVisible) {
    const modRow = addRow();
    const bi = clamp(activeBaseIndex, 0, BASE_NAMES.length - 1);
    const activeColor = BASE_COLORS[bi];
    const modActive = viewMode === "mod";
    MODIFIER_NAMES.forEach((name, mi) => {
      const d = mk(Math.round(settingValue(BASE_NAMES[bi] + name)), modActive && mi === activeModifierIndex, activeColor, name, name, true);
      d.onclick = () => { activeModifierIndex = mi; viewMode = "mod"; buildInterface(); };
      modRow.appendChild(d);
    });
  }
}

function buildSpeed() {
  const wrap = $("speed-control");
  wrap.innerHTML = "";
  wrap.className = "speed-line";
  const isStd = appMode === "std";
  const lo = 0, hi = 100;
  const val = isStd ? stdValues.speed : Math.round(settingValue(SPEED_KEY));
  const onSet = isStd
    ? (v) => { stdValues.speed = v; stdWrite("set:speed:" + v); }
    : (v) => setSpeed(v);
  const label = document.createElement("span");
  label.className = "speed-label";
  label.textContent = "Speed:";
  const num = document.createElement("span");
  num.className = "speed-val";
  num.textContent = val;
  makeEditable(num, lo, hi, onSet);
  const input = document.createElement("input");
  input.type = "range";
  input.min = lo;
  input.max = hi;
  input.value = val;
  input.step = 1;
  input.addEventListener("input", () => { num.textContent = input.value; });
  input.addEventListener("change", () => onSet(parseInt(input.value, 10)));
  const minus = document.createElement("button");
  minus.type = "button";
  minus.className = "step-btn minus";
  minus.textContent = "−";
  const plus = document.createElement("button");
  plus.type = "button";
  plus.className = "step-btn plus";
  plus.textContent = "+";
  wrap.appendChild(label);
  wrap.appendChild(num);
  wrap.appendChild(minus);
  wrap.appendChild(input);
  wrap.appendChild(plus);
  attachStepButton(minus, -1, input, num, lo, hi, onSet);
  attachStepButton(plus, +1, input, num, lo, hi, onSet);
}

function buildSliders() {
  const wrap = $("sliders-wrapper");
  wrap.innerHTML = "";

  const toggleGroup = document.createElement("div");
  toggleGroup.className = "slider-group";
  const toggleLabel = viewMode === "main" ? "Show all settings" : "Show all modifiers";
  toggleGroup.innerHTML = `<label class="inline-toggle">
    <span>${toggleLabel}</span>
    <span class="switch">
      <input type="checkbox" id="showAllCheck" ${showAll ? "checked" : ""}>
      <span class="slider"></span>
    </span>
  </label>`;
  wrap.appendChild(toggleGroup);
  toggleGroup.querySelector("#showAllCheck").onchange = (e) => {
    showAll = e.target.checked;
    buildInterface();
  };

  const bi = clamp(activeBaseIndex, 0, BASE_NAMES.length - 1);
  const baseColor = BASE_COLORS[bi];
  const modColor = (mi) => (viewMode === "mod" && mi === activeModifierIndex)
    ? baseColor
    : `color-mix(in srgb, ${baseColor} 22%, #3a3a3a)`;

  if (showAll) {
    if (viewMode === "main") {
      for (let i = 0; i < BASE_NAMES.length; i++) {
        const r = baseRange(i);
        wrap.appendChild(sliderEl(BASE_NAMES[i], r.min, r.max, Math.round(settingValue(BASE_NAMES[i])), BASE_COLORS[i], (v) => setBase(i, v)));
      }
    } else {
      const selGroup = document.createElement("div");
      selGroup.className = "slider-group";
      selGroup.innerHTML = `<div class="slider-label"><span>Base control</span></div>`;
      const sel = document.createElement("select");
      for (let i = 0; i < BASE_NAMES.length; i++) {
        const o = document.createElement("option");
        o.value = i; o.textContent = BASE_NAMES[i];
        if (i === activeBaseIndex) o.selected = true;
        sel.appendChild(o);
      }
      sel.onchange = () => { activeBaseIndex = parseInt(sel.value, 10); activeModifierIndex = 0; buildInterface(); };
      selGroup.appendChild(sel);
      wrap.appendChild(selGroup);

      MODIFIER_NAMES.forEach((name, mi) => {
        const s = getSetting(BASE_NAMES[bi] + name);
        wrap.appendChild(sliderEl(name, s.min, s.max, Math.round(s.value), modColor(mi), (v) => setModifier(bi, mi, v)));
      });
    }
  } else {
    if (viewMode === "main") {
      const r = baseRange(bi);
      wrap.appendChild(sliderEl(BASE_NAMES[bi], r.min, r.max, Math.round(settingValue(BASE_NAMES[bi])), BASE_COLORS[bi], (v) => setBase(bi, v)));
    } else {
      const mi = clamp(activeModifierIndex, 0, MODIFIER_NAMES.length - 1);
      const name = MODIFIER_NAMES[mi];
      const s = getSetting(BASE_NAMES[bi] + name);
      wrap.appendChild(sliderEl(name, s.min, s.max, Math.round(s.value), modColor(mi), (v) => setModifier(bi, mi, v)));
    }
  }
}

function buildStdSliders() {
  const wrap = $("sliders-wrapper");
  wrap.innerHTML = "";

  wrap.appendChild(sliderEl("Max Depth", 0, 100, stdValues.max, BASE_COLORS[0], (v) => {
    stdValues.max = v;
    if (stdValues.min > stdValues.max) { stdValues.min = stdValues.max; stdWrite("set:min:" + stdValues.min); }
    stdWrite("set:max:" + v);
  }));
  wrap.appendChild(sliderEl("Min Depth", 0, stdValues.max, stdValues.min, BASE_COLORS[1], (v) => {
    stdValues.min = Math.min(v, stdValues.max);

  }));

    const o = document.createElement("option");
    o.value = p.idx; o.textContent = p.name;
    if (p.idx === stdValues.pattern) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => {
    stdValues.pattern = parseInt(sel.value, 10);
    stdWrite("set:pattern:" + stdValues.pattern);

let activeStep = null;

function stopStepRepeat() {
  if (activeStep) {
    clearTimeout(activeStep.timer);
    activeStep = null;
  }
}
document.addEventListener("pointerup", stopStepRepeat);
document.addEventListener("pointercancel", stopStepRepeat);

function attachStepButton(btn, delta, input, valNum, min, max, onSet) {
  const apply = () => {
    const cur = parseInt(input.value, 10);
    let v = cur + delta;
    if (v < min) v = min;
    if (v > max) v = max;
    if (v === cur) return;
    input.value = v;
    valNum.textContent = v;
    onSet(v);
  };
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    apply();
    stopStepRepeat(); // cancel any previous hold before starting this one
    const st = { timer: null };
    activeStep = st;
    let delay = 400;
    st.timer = setTimeout(function repeat() {
      apply();
      delay = Math.max(90, delay - 40);
      st.timer = setTimeout(repeat, delay);
    }, delay);
  });
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}

function makeEditable(el, min, max, onSet) {
  const commit = (v) => {
    v = clamp(Math.round(parseInt(v, 10) || 0), min, max);
    el.textContent = v;
    onSet(v);
  };
  if (!el.title) el.title = "Click to edit";
  el.addEventListener("click", () => {
    if (el.querySelector("input")) return;
    const original = el.textContent;
    const inp = document.createElement("input");
    inp.type = "number";
    inp.className = "val-input";
    inp.value = original;
    el.textContent = "";
    el.appendChild(inp);
    inp.focus();
    inp.select();
    let done = false;
    const finish = (apply) => {
      if (done) return;
      done = true;
      if (apply) commit(inp.value);
      else el.textContent = original;
    };
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    inp.addEventListener("blur", () => finish(true));
  });
  return el;
}

function sliderEl(name, min, max, value, color, onSet) {
  const g = document.createElement("div");
  g.className = "slider-group";
  g.innerHTML = `
    <div class="slider-row">
      <span class="slider-name">${name}</span>
      <span class="val-num" style="background:${color}; color:${tabTextColor(color)}">${value}</span>
      <button type="button" class="step-btn minus">−</button>
      <input type="range" min="${min}" max="${max}" value="${value}" step="1">
      <button type="button" class="step-btn plus">+</button>
    </div>`;
  const input = g.querySelector("input");
  const valNum = g.querySelector(".val-num");
  makeEditable(valNum, min, max, onSet);
  input.addEventListener("input", () => { valNum.textContent = input.value; });
  input.addEventListener("change", () => onSet(parseInt(input.value, 10)));
  const [minus, plus] = g.querySelectorAll(".step-btn");
  attachStepButton(minus, -1, input, valNum, min, max, onSet);
  attachStepButton(plus, +1, input, valNum, min, max, onSet);
  return g;
}

function renderPresets() {
  const list = $("presetList");
  list.innerHTML = "";
  const sel = document.createElement("select");
  presetNames.forEach(name => {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  });
  if (presetNames.includes(presetSelection)) sel.value = presetSelection;
  else if (presetNames.length) { sel.selectedIndex = 0; presetSelection = presetNames[0]; }
  sel.onchange = () => { presetSelection = sel.value; $("presetSummaryName").textContent = presetSelection; };

  const load = document.createElement("button");
  load.textContent = "Load";
  load.onclick = async () => {
    if (!sel.value) return;
    await writePreset(":" + sel.value);
    setTimeout(refreshStatus, 800);
  };
  const del = document.createElement("button");
  del.textContent = "Delete";
  del.className = "danger";
  del.onclick = async () => {
    if (!sel.value) return;
    await writePreset("<" + sel.value);
    setTimeout(refreshPresets, 800);
  };

  list.appendChild(sel);
  list.appendChild(load);
  list.appendChild(del);
  $("presetSummaryName").textContent = presetSelection;
}

// ---------- Graph ----------
// Faithful port of AP-mode.cpp drawing: same plot bounds, sample counts,
// colors (RGB565), and Bezier/step-trace math as the M5 screen.
const SAMPLE_MAIN = 48;   // s_curve_main_pts[48]
const SAMPLE_MOD = 24;    // s_curve_mod_pts[24]
const PLOT_X = 2;         // k_graph_plot_x_margin
const PLOT_Y = 0;         // top margin: keep traces inside the chart box (M5's -12 gets clipped)
const DOT_MAIN = "#ffffff";
const DOT_MOD = "#94a3b8";

function sv(k, fb = 0) { return settingValue(k, fb); }
function bezierMath(v0, v1, v2, v3, t) {
  return Math.pow(1 - t, 3) * v0 + 3 * Math.pow(1 - t, 2) * t * v1 + 3 * (1 - t) * Math.pow(t, 2) * v2 + Math.pow(t, 3) * v3;
}
function baseVal(i) { return clamp(settingValue(BASE_NAMES[i]), 0, 100); }

// computeGraphPlotBounds() for the 280x132 panel.
function plotBounds() {
  return { x: PLOT_X, y: PLOT_Y, w: canvas.width - 4, h: canvas.height - 5 };
}

function dot(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
}

// Main screen: AP-mode.cpp updateCurvePreview() "live AP curve" layout.
function drawMainGraph() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const { x: xMin, y: yMin, w: xSpan, h: ySpan } = plotBounds();

  const topVal = sv("Max Depth", 50), bottomVal = sv("Min Depth", 50);
  const riseVal = sv("In Speed", 1), fallVal = sv("Out Speed", 1);
  const curveIn = sv("In Accel", 50), curveOut = sv("Out Accel", 50);

  // Depth guides: top=0xF860, bottom=0xFC00, width=plot.w.
  const yMax = yMin + (1 - topVal / 100) * ySpan;
  const yMinDepth = yMin + (1 - bottomVal / 100) * ySpan;
  ctx.fillStyle = BASE_COLORS[0]; ctx.fillRect(xMin, yMax, xSpan, 2);
  ctx.fillStyle = BASE_COLORS[1]; ctx.fillRect(xMin, yMinDepth, xSpan, 2);

  const yMinBound = Math.min(yMax, yMinDepth);
  const yMaxBound = Math.max(yMax, yMinDepth);
  const diff = yMinDepth - yMax;
  const yMaxMod = (1 - sv("Max DepthAmplitude", 100) / 100) * diff + yMax;
  const yMinMod = yMinDepth - (1 - sv("Min DepthAmplitude", 100) / 100) * diff;

  const a = Math.max(1, riseVal), b = Math.max(1, fallVal);
  const am = Math.max(1, sv("In SpeedAmplitude", 100) / 100 * a);
  const bm = Math.max(1, sv("Out SpeedAmplitude", 100) / 100 * b);

  let splitXf = xMin + (1 - (a / b) / ((a / b) + 1)) * xSpan;
  splitXf = clamp(splitXf, xMin, xMin + xSpan);
  let splitXm = xMin + (1 - (am / bm) / ((am / bm) + 1)) * xSpan;
  splitXm = clamp(splitXm, xMin, xMin + xSpan);

  const c = Math.max(1, curveIn), d = Math.max(1, curveOut);
  const cm = Math.max(1, sv("In AccelAmplitude", 100) / 100 * c);
  const dm = Math.max(1, sv("Out AccelAmplitude", 100) / 100 * d);

  const rIn = 0.1 + 0.4 * (1 - c / 100);
  const rOut = 0.1 + 0.4 * (1 - d / 100);
  const rInMod = 0.1 + 0.4 * (1 - cm / 100);
  const rOutMod = 0.1 + 0.4 * (1 - dm / 100);

  const splitSample = Math.round((splitXf - xMin) / xSpan * (SAMPLE_MAIN - 1));
  const splitSampleMod = Math.round((splitXm - xMin) / xSpan * (SAMPLE_MAIN - 1));
  const riseDiff = (splitXf - xMin) * rIn;
  const fallDiff = ((xMin + xSpan) - splitXf) * rOut;
  const riseDiffMod = (splitXm - xMin) * rInMod;
  const fallDiffMod = ((xMin + xSpan) - splitXm) * rOutMod;

  const mainDots = [], modDots = [];
  for (let i = 0; i < SAMPLE_MAIN; i++) {
    let x, y;
    if (i <= splitSample) {
      const tl = splitSample > 0 ? i / splitSample : 0;
      x = bezierMath(xMin, xMin + riseDiff, splitXf - riseDiff, splitXf, tl);
      y = bezierMath(yMinDepth, yMinDepth, yMax, yMax, tl);
    } else {
      const fallCount = (SAMPLE_MAIN - 1) - splitSample;
      const tr = fallCount > 0 ? (i - splitSample) / fallCount : 1;
      x = bezierMath(splitXf, splitXf + fallDiff, (xMin + xSpan) - fallDiff, xMin + xSpan, tr);
      y = bezierMath(yMax, yMax, yMinDepth, yMinDepth, tr);
    }
    y = clamp(y, yMinBound, yMaxBound);
    mainDots.push([x, y]);

    if ((i % 2) === 0) {
      let xM, yM;
      if (i <= splitSampleMod) {
        const tl = splitSampleMod > 0 ? i / splitSampleMod : 0;
        xM = bezierMath(xMin, xMin + riseDiffMod, splitXm - riseDiffMod, splitXm, tl);
        yM = bezierMath(yMinMod, yMinMod, yMaxMod, yMaxMod, tl);
      } else {
        const fallCountMod = (SAMPLE_MAIN - 1) - splitSampleMod;
        const tr = fallCountMod > 0 ? (i - splitSampleMod) / fallCountMod : 1;
        xM = bezierMath(splitXm, splitXm + fallDiffMod, (xMin + xSpan) - fallDiffMod, xMin + xSpan, tr);
        yM = bezierMath(yMaxMod, yMaxMod, yMinMod, yMinMod, tr);
      }
      yM = clamp(yM, yMinBound, yMaxBound);
      modDots.push([xM, yM]);
    }
  }

  // Continuous curved line through the main stroke samples.
  if (mainDots.length > 1) {
    ctx.strokeStyle = DOT_MAIN; ctx.lineWidth = 2; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(mainDots[0][0], mainDots[0][1]);
    for (let i = 1; i < mainDots.length; i++) ctx.lineTo(mainDots[i][0], mainDots[i][1]);
    ctx.stroke();
  }
  modDots.forEach(([x, y]) => dot(x, y, DOT_MOD));

  $("left-meter").style.height = topVal + "%";
  $("right-meter").style.height = bottomVal + "%";
}

// Modifier screen: AP-mode.cpp updateModifierPreview() + drawSingleModifierTrace().
function drawModGraph() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const { x: xMin, y: yMin, w: xSpan, h: ySpan } = plotBounds();
  const n = BASE_NAMES.length;

  let maxSteps = 4;
  for (let c = 0; c < n; c++) {
    let s = 0;
    for (let m = 1; m <= 4; m++) s += sv(BASE_NAMES[c] + MODIFIER_NAMES[m], 0);
    if (s > maxSteps) maxSteps = s;
  }

  const trace = (controlIndex, traceIndex, highlight) => {
    if (controlIndex < 0 || traceIndex < 0 || traceIndex >= 6) return;
    if (controlIndex >= n || maxSteps <= 0) return;

    const name = BASE_NAMES[controlIndex];
    const baseValueRatio = 1 - sv(name, 50) / 100;
    const modValueRatio = 1 - sv(name + "Amplitude", 100) / 100;

    let strokeRatio = 1 - baseValueRatio;
    if (controlIndex < 2) strokeRatio = (sv("Max Depth", 50) - sv("Min Depth", 50)) / 100;

    const baseY = yMin + ySpan * baseValueRatio;
    let modY = baseY + ySpan * strokeRatio * modValueRatio;
    if (controlIndex === 1) modY = baseY - ySpan * strokeRatio * modValueRatio;

    const stepWidth = xSpan / maxSteps;
    let startX = xMin - stepWidth * sv(name + "Offset", 0);

    ctx.strokeStyle = BASE_COLORS[traceIndex % BASE_COLORS.length];
    ctx.lineWidth = highlight ? 3 : 2;
    ctx.beginPath();

    let segmentIndex = 0, segment = 0, guard = 0, zeroStepGuard = 0;
    while (startX < (xMin + xSpan) && guard < 96 && segmentIndex < 64) {
      const stepIndex = Math.min(segment + 1, 5);
      const step = Math.max(0, sv(name + MODIFIER_NAMES[stepIndex], 0)) * stepWidth;

      if (step <= 0) {
        segment = (segment + 1) % 4;
        ++zeroStepGuard;
        if (zeroStepGuard >= 8) break;
        continue;
      }
      zeroStepGuard = 0;

      const endX = startX + step;
      let y0 = baseY, y1 = baseY;
      if (segment === 0) { y0 = baseY; y1 = modY; }
      else if (segment === 1) { y0 = modY; y1 = modY; }
      else if (segment === 2) { y0 = modY; y1 = baseY; }

      const cx0 = clamp(startX, xMin, xMin + xSpan);
      const cx1 = clamp(endX, xMin, xMin + xSpan);
      const cy0 = clamp(y0, yMin, yMin + ySpan);
      const cy1 = clamp(y1, yMin, yMin + ySpan);
      ctx.moveTo(cx0, cy0);
      ctx.lineTo(cx1, cy1);

      ++segmentIndex;
      startX = endX;
      segment = (segment + 1) % 4;
      ++guard;
    }
    ctx.stroke();
  };

  for (let c = 0; c < n; c++) trace(c, c, false);
  trace(activeBaseIndex, activeBaseIndex, true);

  $("left-meter").style.height = baseVal(0) + "%";
  $("right-meter").style.height = baseVal(1) + "%";
}

function drawStdGraph() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const { x: xMin, y: yMin, w: xSpan, h: ySpan } = plotBounds();
  const topVal = clamp(stdValues.max, 0, 100);
  const bottomVal = clamp(stdValues.min, 0, 100);
  const yMax = yMin + (1 - topVal / 100) * ySpan;
  const yMinDepth = yMin + (1 - bottomVal / 100) * ySpan;

  ctx.fillStyle = BASE_COLORS[0]; ctx.fillRect(xMin, yMax, xSpan, 2);
  ctx.fillStyle = BASE_COLORS[1]; ctx.fillRect(xMin, yMinDepth, xSpan, 2);

  // Simple in-and-out stroke curve between min and max depth.
  ctx.strokeStyle = DOT_MAIN; ctx.lineWidth = 2; ctx.lineJoin = "round";
  ctx.beginPath();
  for (let i = 0; i <= SAMPLE_MAIN; i++) {
    const t = SAMPLE_MAIN ? i / SAMPLE_MAIN : 0;
    const wave = 0.5 - 0.5 * Math.cos(2 * Math.PI * t);
    const depth = bottomVal + (topVal - bottomVal) * wave;
    const px = xMin + t * xSpan;
    const py = yMin + (1 - depth / 100) * ySpan;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  $("left-meter").style.height = topVal + "%";
  $("right-meter").style.height = bottomVal + "%";
}

function drawGraph() {
  if (appMode === "std") drawStdGraph();
  else if (viewMode === "mod") drawModGraph();
  else drawMainGraph();
}

// ---------- Events ----------
$("ble-button").onclick = connect;
$("header-disconnect").onclick = disconnect;
$("modeAp").onclick = () => { appMode = "ap"; buildInterface(); };
$("modeStd").onclick = () => { appMode = "std"; buildInterface(); };
$("btnStart").onclick = toggleStart;
$("btnSavePreset").onclick = () => {
  const n = $("presetName").value.trim();
  if (!n) return;
  presetNames.push(n);
  $("presetName").value = "";
  writePreset(">" + n).catch(() => {});
  renderPresets();
};
$("btnFactoryReset").onclick = () => {
  presetNames = [];
  writePreset("^").catch(() => {});
  renderPresets();
};
$("btnResetValues").onclick = resetAllValues;

buildInterface();
